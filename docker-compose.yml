name: payment-webhooks

# Local stack. `make dev` starts only db + redis (run Django/Celery with uv); `make up` runs everything.
x-app-env: &app-env
  DJANGO_SETTINGS_MODULE: config.settings.production
  SECRET_KEY: local-docker-secret
  ALLOWED_HOSTS: "*"
  DB_NAME: payments
  DB_USER: payments
  DB_PASSWORD: payments
  DB_HOST: db
  DB_PORT: "5432"
  DB_SSLMODE: disable
  REDIS_URL: redis://redis:6379/0

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: celery -A config worker --beat --schedule /tmp/celerybeat-schedule --pool=threads --concurrency=32 --loglevel=info
    environment: *app-env
    # Warm shutdown lets in-flight 30s tasks finish before the container stops.
    stop_grace_period: 45s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
