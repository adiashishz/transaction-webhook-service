[project]
name = "transaction-webhook-service"
version = "0.1.0"
description = "Receives payment webhooks, acknowledges them instantly and processes transactions in the background."
requires-python = ">=3.12"
dependencies = [
    "django>=6.0",
    "djangorestframework>=3.15",
    "psycopg[binary]>=3.2",
    "python-decouple>=3.8",
    "celery[redis]>=5.5",
    "gunicorn>=22.0",
    "whitenoise>=6.7",
    "drf-spectacular>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
# collectstatic only runs in the Docker image; WhiteNoise warns when the directory is missing locally.
filterwarnings = ["ignore:No directory at:UserWarning"]
